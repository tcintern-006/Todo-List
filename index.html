<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Todo App</title>
</head>

<style>
  
    
</style>

<body>
    <header>
        <nav>
            <i class="fa-solid fa-bars  bars"></i>
            <h1>Todo's</h1>
          <ul class="hidden">
    <i class="fa-solid fa-x bars"></i>
    <li class="nav-total">Total Tasks <span></span></li>
    <li class="nav-completed">Task Completed <span></span></li>
    <li class="nav-pending">Pending Task <span></span></li>
</ul>
        </nav>
    </header>

    <section>
        <div class="addition_bar">
            <input type="text" placeholder="Enter Task" id="">
            <button class="btn addbtn">ADD</button>
        </div>
    </section>
    

    <section class="editsection">
        <ul class="task-container">
          
            
        </ul>
    </section>


    <section>
      <div class="stats">
    <h2 class="total btn stat-total">Total : <span>0</span></h2>
    <h2 class="pending btn stat-pending">Pending : <span>0</span></h2>
    <h2 class="completed btn stat-completed">Completed : <span>0</span></h2>
</div>
    </section>

    <footer>
        <p>&copy; 2026 Todo's App. All rights reserved.</p>
    </footer>


    <script src="script.js"></script>
</body>

</html>
